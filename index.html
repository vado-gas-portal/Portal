<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B4EA2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dist Connect">
<meta name="robots" content="noindex">
<title>Distributor Connect</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23fff'/%3E%3Crect x='14' y='6' width='36' height='52' rx='12' fill='%230B4EA2'/%3E%3Crect x='20' y='42' width='24' height='6' rx='3' fill='%23C8102E'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23fff'/%3E%3Crect x='14' y='6' width='36' height='52' rx='12' fill='%230B4EA2'/%3E%3Crect x='20' y='42' width='24' height='6' rx='3' fill='%23C8102E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF1F5;--surface:#FFFFFF;--sunk:#F6F8FB;--ink:#14213D;--muted:#5A6477;--line:#D6DCE6;
  --brand:#0B4EA2;--brand-soft:#E3ECF8;--onbrand:#FFFFFF;--stripe:#C8102E;
  --red:#B00E28;--red-soft:#FBE6E9;--amber:#8F5400;--amber-soft:#FDF0D9;
  --green:#1C7445;--green-soft:#E1F3E8;--violet:#5B3FA6;--violet-soft:#ECE7F8;
  --teal:#0E6E7A;--teal-soft:#DFF2F4;--focus:#F2A900;--overlay:rgba(20,33,61,.45);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1524;--surface:#16213A;--sunk:#111B30;--ink:#E7ECF5;--muted:#9AA7BC;--line:#2A3854;
    --brand:#4C8FE6;--brand-soft:#1C2F52;--onbrand:#08142A;--stripe:#E5455C;
    --red:#FF8A9A;--red-soft:#3A1A24;--amber:#F2B65C;--amber-soft:#3A2C14;
    --green:#6FD39C;--green-soft:#15352A;--violet:#B6A2F0;--violet-soft:#2A2448;
    --teal:#6CD0DB;--teal-soft:#123338;--overlay:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1524;--surface:#16213A;--sunk:#111B30;--ink:#E7ECF5;--muted:#9AA7BC;--line:#2A3854;
  --brand:#4C8FE6;--brand-soft:#1C2F52;--onbrand:#08142A;--stripe:#E5455C;
  --red:#FF8A9A;--red-soft:#3A1A24;--amber:#F2B65C;--amber-soft:#3A2C14;
  --green:#6FD39C;--green-soft:#15352A;--violet:#B6A2F0;--violet-soft:#2A2448;
  --teal:#6CD0DB;--teal-soft:#123338;--overlay:rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Hind,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3,.rid,.brandmark,.tile b,.bigpin{font-family:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif}
h1{font-size:1.75rem;line-height:1.15;margin:0;font-weight:700}
h2{font-size:1.4rem;line-height:1.2;margin:0;font-weight:600}
h3{font-size:1.15rem;margin:1.5rem 0 .5rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.88rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
img{max-width:100%}
[hidden]{display:none!important}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--onbrand);border-bottom:4px solid var(--stripe)}
.bar-in{max-width:1040px;margin:0 auto;padding:.6rem 1rem;display:flex;align-items:center;gap:.75rem}
.brandmark{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:1.2rem}
.mark{width:22px;height:28px;border-radius:7px 7px 4px 4px;background:var(--onbrand);position:relative;flex:none}
.mark::after{content:"";position:absolute;left:3px;right:3px;bottom:5px;height:4px;border-radius:2px;background:var(--stripe)}
.bar .who{margin-left:auto;font-size:.9rem;opacity:.92;text-align:right;line-height:1.2}
.bar button{background:transparent;border:1.5px solid currentColor;border-radius:8px;padding:.3rem .7rem;cursor:pointer;color:var(--onbrand)}

.wrap{max-width:1040px;margin:0 auto;padding:1.25rem 1rem 3rem}
.hello{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.25rem}

.btn{border-radius:10px;padding:.6rem 1.05rem;font-weight:600;cursor:pointer;background:var(--sunk);border:1px solid var(--line)}
.btn.primary{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.btn.ok{background:var(--green);color:var(--surface);border-color:var(--green)}
.btn.warn{background:var(--amber);color:var(--surface);border-color:var(--amber)}
.btn.bad{background:var(--red);color:var(--surface);border-color:var(--red)}
.btn.ghost{background:transparent}
.btn.sm{padding:.35rem .7rem;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--brand);text-decoration:underline;cursor:pointer;padding:0;font-size:.95rem}

.c-brand{--c:var(--brand);--cs:var(--brand-soft)}
.c-violet{--c:var(--violet);--cs:var(--violet-soft)}
.c-amber{--c:var(--amber);--cs:var(--amber-soft)}
.c-teal{--c:var(--teal);--cs:var(--teal-soft)}
.c-green{--c:var(--green);--cs:var(--green-soft)}
.c-red{--c:var(--red);--cs:var(--red-soft)}
.c-grey{--c:var(--muted);--cs:var(--sunk)}
.chip{display:inline-block;padding:.05rem .55rem;border-radius:999px;background:var(--cs);color:var(--c);font-size:.82rem;font-weight:600;white-space:nowrap;vertical-align:middle}

.tabs{display:flex;gap:.25rem;border-bottom:2px solid var(--line);margin-bottom:1.25rem;overflow-x:auto}
.tabs button{border:0;background:none;padding:.6rem .9rem;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--brand);border-bottom-color:var(--brand)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:.6rem;margin-bottom:1rem}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem;cursor:pointer;border-top:4px solid var(--c,var(--line))}
.tile b{display:block;font-size:2rem;line-height:1;color:var(--c,var(--ink))}
.tile span{font-size:.9rem;color:var(--muted)}
.tile[aria-pressed="true"]{background:var(--cs,var(--sunk));outline:2px solid var(--c,var(--ink));outline-offset:-2px}

.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.5rem;margin-bottom:1rem}
.filters select,.filters input{width:100%;padding:.55rem .7rem;border:1px solid var(--line);border-radius:10px;background:var(--surface)}

.seg{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.35rem .9rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.list{display:flex;flex-direction:column;gap:.5rem}
.row{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:.75rem .9rem;cursor:pointer}
.row:hover{background:var(--sunk)}
.row-top{display:flex;justify-content:space-between;gap:.5rem;align-items:center;flex-wrap:wrap}
.rid{font-weight:700;font-size:1.05rem;letter-spacing:.02em}
.row-title{margin-top:.1rem;font-weight:500}
.row-meta{font-size:.88rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:.2rem 1rem;margin-top:.15rem}
.late{color:var(--red);font-weight:600}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:2rem 1rem;text-align:center;color:var(--muted)}
.empty .btn{margin-top:.75rem}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.75rem .9rem;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.75rem}
.item .grow{flex:1 1 320px;min-width:0}
.toggles{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.sw{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem .2rem .45rem;cursor:pointer;font-size:.9rem;background:var(--sunk)}
.sw input{width:1.05rem;height:1.05rem;accent-color:var(--brand);margin:0}
.sw:has(input:checked){background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}

.login{min-height:100%;display:grid;place-items:center;padding:2rem 1rem}
.login-card{width:100%;max-width:430px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.5rem;border-top:6px solid var(--brand)}
.login-card .brandmark{color:var(--brand);font-size:1.6rem}
.login-card .brandmark .mark{background:var(--brand)}
.hint{margin-top:1rem;font-size:.85rem;color:var(--muted);background:var(--sunk);border-radius:8px;padding:.5rem .7rem}

.field{display:block;margin-bottom:.85rem}
.field>span{display:block;font-weight:500;margin-bottom:.25rem}
.field input,.field select,.field textarea{width:100%;padding:.6rem .75rem;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.field textarea{min-height:5rem;resize:vertical}
.field small{color:var(--muted);font-size:.85rem;display:block;margin-top:.2rem}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 .75rem}
.err{color:var(--red);font-size:.92rem;margin:.25rem 0 .75rem}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:.85rem;background:var(--sunk)}
.drop label.add{color:var(--brand);font-weight:600;cursor:pointer}
.pending{list-style:none;padding:0;margin:.5rem 0 0;font-size:.9rem}
.pending li{display:flex;justify-content:space-between;gap:.5rem;padding:.2rem 0}
.pending button{border:0;background:none;color:var(--red);cursor:pointer}
.members{border:1px solid var(--line);border-radius:12px;padding:.75rem;margin:0 0 .85rem}
.members legend{font-weight:500;padding:0 .3rem}
.mem{display:grid;grid-template-columns:1fr 7.5rem auto;gap:.4rem;margin-bottom:.4rem;align-items:center}
.mem input{padding:.5rem .6rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%}
.mem button{border:0;background:none;color:var(--red);cursor:pointer;padding:.3rem}

.types{display:grid;gap:.6rem}
.type{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.85rem 1rem;cursor:pointer}
.type:hover{border-color:var(--brand)}
.type strong{display:block;font-size:1.05rem}
.type span{font-size:.9rem;color:var(--muted)}

.sheet{position:fixed;inset:0;z-index:20;background:var(--overlay);display:none;justify-content:flex-end}
.sheet.open{display:flex}
.panel{background:var(--bg);width:100%;max-width:660px;height:100%;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 1rem) 1.1rem calc(env(safe-area-inset-bottom,0px) + 2rem);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem}
.x{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;cursor:pointer;font-size:1.3rem;flex:none}
.statusbar{background:var(--cs);color:var(--c);border-radius:12px;padding:.75rem 1rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:.25rem 1rem;font-weight:600}
.statusbar span{font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem}
.card+.card{margin-top:.6rem}
.kv{display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:.35rem 1rem;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.mtable{width:100%;border-collapse:collapse;font-size:.95rem}
.mtable th,.mtable td{text-align:left;padding:.35rem .4rem;border-bottom:1px solid var(--line)}
.mtable th{color:var(--muted);font-weight:500}
.scan{border-left:5px solid var(--c);}
.scan .verdict{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;padding:.3rem 0;border-bottom:1px solid var(--line)}
.scan .verdict:last-of-type{border-bottom:0}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.5rem}
.file{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.4rem;cursor:pointer;text-align:left;font-size:.82rem;overflow-wrap:anywhere}
.file .thumb{height:84px;border-radius:6px;background:var(--sunk);display:grid;place-items:center;overflow:hidden;margin-bottom:.3rem;color:var(--muted);font-weight:600;text-align:center;padding:.25rem}
.file .thumb img{width:100%;height:100%;object-fit:cover}
.file small{display:block;color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0 0 0 1.1rem;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 1rem .6rem}
.timeline li::before{content:"";position:absolute;left:-1.55rem;top:.35rem;width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid var(--bg)}
.timeline .when{font-size:.85rem;color:var(--muted)}
.timeline .rem{margin-top:.15rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.4rem .6rem;font-size:.95rem}
.actions{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.note{background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:.6rem .8rem;margin-bottom:.75rem}
.info{background:var(--brand-soft);color:var(--brand);border-radius:10px;padding:.6rem .8rem;margin-bottom:.75rem}
.bigpin{font-size:2.6rem;font-weight:700;letter-spacing:.3em;margin:.25rem 0;color:var(--brand)}
.mailbody{white-space:pre-wrap;font-family:inherit;margin:.75rem 0 0;padding-top:.75rem;border-top:1px solid var(--line)}
.logrow{display:grid;grid-template-columns:9.5rem 1fr;gap:.25rem 1rem;padding:.5rem .2rem;border-bottom:1px solid var(--line);font-size:.93rem}
.logrow button{all:unset;cursor:pointer}
@media (max-width:540px){.logrow{grid-template-columns:1fr}}

.preview{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.8);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + .75rem) .75rem calc(env(safe-area-inset-bottom,0px) + .75rem)}
.preview.open{display:flex}
.preview-head{display:flex;justify-content:space-between;align-items:center;color:#fff;gap:1rem;margin-bottom:.5rem}
.preview-body{flex:1;display:grid;place-items:center;overflow:auto;background:#222;border-radius:10px}
.preview-body img{max-height:100%;object-fit:contain}
.preview-body iframe{width:100%;height:100%;border:0;background:#fff}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 1rem);transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:.6rem 1rem;border-radius:10px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
.toast.show{opacity:1}
.foot{text-align:center;margin-top:2rem;font-size:.85rem;color:var(--muted)}
.foot button{background:none;border:0;color:var(--brand);text-decoration:underline;cursor:pointer}
.busy{display:flex;gap:.6rem;align-items:center;color:var(--brand);font-weight:500}
.spin{width:18px;height:18px;border:3px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(20,33,61,.25);display:none;place-items:center}
.overlay.open{display:grid}
.overlay .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.25rem;display:flex;gap:.7rem;align-items:center;max-width:90%}
.ocrtext{white-space:pre-wrap;font-size:.85rem;background:var(--sunk);border-radius:8px;padding:.5rem .6rem;max-height:14rem;overflow:auto;margin-top:.4rem}

/* ---------- Navya leads ---------- */
.row.lead{cursor:default}
.row.lead:hover{background:var(--surface)}
.lead-name{font-size:1.05rem}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:.25rem;margin:.55rem 0 .45rem}
.track i{font-style:normal;font-size:.78rem;color:var(--muted);text-align:center}
.track i::before{content:"";display:block;height:6px;border-radius:3px;background:var(--line);margin-bottom:.2rem}
.track i.on{color:var(--ink);font-weight:600}
.track i.on::before{background:var(--c,var(--brand))}
.c-red .track i.on::before{background:var(--brand)}
.track.rej i::before{background:repeating-linear-gradient(45deg,var(--line) 0 4px,var(--sunk) 4px 8px)}
.track.rej i.on::before{background:var(--muted)}
.lead-acts{margin-top:.55rem}
.lead-acts .primary{margin-left:auto}
a.btn{text-decoration:none;color:var(--ink);display:inline-block}
.ntable-wrap{overflow-x:auto;padding:.4rem .6rem}
.ntable th:not(:first-child),.ntable td:not(:first-child){text-align:right}
.ntable tbody tr{cursor:pointer}
.ntable tbody tr:hover td{background:var(--sunk)}
.bulk{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-bottom:1rem}
.bulk select{flex:1 1 180px;padding:.5rem .6rem;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.crow{display:flex;width:100%;justify-content:space-between;align-items:center;gap:.6rem;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.55rem .8rem;cursor:pointer}
.crow:hover{background:var(--sunk)}
.crow-main{min-width:0;display:flex;flex-direction:column}
.crow-main b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow-main small{color:var(--muted);font-size:.84rem}
.crow-flags{display:flex;flex-wrap:wrap;gap:.25rem;justify-content:flex-end;flex:none;max-width:55%}
.item.open{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.close-row{float:right;font-size:.9rem;font-weight:600}
.wa-msg{white-space:pre-wrap;font-family:inherit;font-size:.86rem;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:.5rem .65rem;margin:.5rem 0 0;color:var(--ink)}
a.btn.primary{color:var(--onbrand)}
</style>

</head>
<body>
<div id="app"><p style="padding:2rem;text-align:center;color:#5A6477">Loading…</p></div>
<div class="sheet" id="sheet" aria-hidden="true"><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div class="preview" id="preview"><div class="preview-head"><strong id="pvName"></strong><button class="x" data-a="closePreview" aria-label="Close preview">×</button></div><div class="preview-body" id="pvBody"></div></div>
<div class="overlay" id="overlay"><div class="box"><span class="spin"></span><span id="overlayMsg">Working…</span></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
'use strict';
/* ===== PASTE YOUR APPS SCRIPT /exec LINK BETWEEN THE QUOTES ===== */
const API_URL='https://script.google.com/macros/s/AKfycbxCT6TIdb7_J7KDwdFtGyEc4bMsaxOaVnlaGr_8zPvZePmPdAN4931zBgiu1PXH8Q7Crg/exec';
/* ================================================================ */
const XLSX_URL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const MAX_FILE=5*1024*1024,MAX_TOTAL=15*1024*1024;
const STATUS={SUB:{label:'Submitted',c:'brand'},REV:{label:'Under review',c:'violet'},RSR:{label:'Resubmission required',c:'amber'},RSB:{label:'Resubmitted',c:'teal'},CMP:{label:'Completed',c:'green'},REJ:{label:'Rejected',c:'red'}};
const OPEN=['SUB','REV','RSR','RSB'];
const CN={k:'consumerNo',label:'Consumer number',req:1,mode:'numeric'};
const CNAME={k:'consumerName',label:'Consumer name',req:1};
const TYPES={
  UNB:{name:'Unblock consumer account',sheet:'Unblock',hint:'Request to unblock a blocked consumer',

/* Shrink phone photos before upload: longest side up to 2000 px, JPEG, about 1 MB or less. Returns null to keep the original. */
async function shrinkImage(file){
  const heic=/heic|heif/i.test(file.type)||/\.(heic|heif)$/i.test(file.name);
  if(!heic&&file.size<=900*1024)return null;
  if(!/^image\/(jpeg|jpg|png|webp)$/i.test(file.type)&&!heic)return null;
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('decode'));i.src=url});
    const w=img.naturalWidth,h=img.naturalHeight;if(!w||!h)return null;
    let max=2000,q=0.82,blob=null;
    for(let k=0;k<5;k++){
      const sc=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q));
      if(blob&&blob.size<=1048576)break;
      max=Math.round(max*0.8);q=Math.max(0.6,q-0.07);
    }
    if(!blob||(!heic&&blob.size>=file.size))return null;
    return {name:file.name.replace(/\.[^.]+$/,'')+'.jpg',type:'image/jpeg',size:blob.size,data:await readAsData(blob),from:file.size};
  }catch(e){return null}finally{URL.revokeObjectURL(url)}
}

function dataToBlob(d){const i=d.indexOf(',');return b64ToBlob(d.slice(i+1),(d.slice(0,i).match(/data:([^;]+)/)||[])[1]||'application/octet-stream')}
function download(name,blob){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),8000)}

function call(fn,...args){

const WA_STALE=3;
function waItems(){

  S.requests.filter(r=>r.status==='RSR').forEach(r=>{(map[r.code]=map[r.code]||{rsr:[],fresh:0,stale:0}).rsr.push(r.id)});

function lastBy(r,by){const h=[...r.history].reverse().find(x=>x.by===by&&x.remark&&x.remark!=='Request raised.');return h?h.remark:''}
function scanText(r){const s=r.scan;if(!s)return '';
  if(s.kind==='ration')return `Card no. read: ${s.cardNumber||'not readable'} (${s.match==null?'not checked':s.match?'matches':'DOES NOT MATCH'}); ${s.expect==='absent'?'deseeded person on card':'consumer on card'}: ${s.personFound==null?'unclear':s.personFound?'found':'not found'}${s.members&&s.members.length?'; members read: '+s.members.join(', '):''}`;
  return `SV no. read: ${(s.svNumbers||[]).join(', ')||'none'} (${s.match==null?'not checked':s.match?'matches':'DOES NOT MATCH'})${s.docType?'; '+s.docType:''}`}
function buildWorkbook(rows){
  const X=window.XLSX,wb=X.utils.book_new();
  const common=r=>{const d=dist(r.code);return {'Request ID':r.id,'Distributor Code':r.code,'Distributor Name':d.name,'Sales Area':d.sa,'District':d.district,'Regional Office':d.ro,'Request Type':TYPES[r.type].name}};
  const tail=r=>({'Status':st(r.status).label,'Raised On':fmt(r.createdAt),'Last Updated':fmt(r.updatedAt),'Days Pending':OPEN.includes(r.status)?daysOld(r.createdAt):'','Latest Officer Remark':lastBy(r,'so'),'Latest Distributor Reply':lastBy(r,'dist'),'Scan Result':scanText(r),'Attachments':allFiles(r).map(f=>f.name+(f.archived?' (archived)':'')).join('; ')});
  const sheet=(name,data)=>{const ws=X.utils.json_to_sheet(data);const keys=Object.keys(data[0]||{});ws['!cols']=keys.map(k=>({wch:Math.min(45,Math.max(k.length,...data.map(o=>String(o[k]??'').length))+2)}));X.utils.book_append_sheet(wb,ws,name.slice(0,31))};
  sheet('Summary',rows.map(r=>Object.assign(common(r),{'Consumer No':r.fields.consumerNo||'','Consumer / Person Name':r.fields.consumerName||''},tail(r))));
  for(const [k,t] of Object.entries(TYPES)){const rs=rows.filter(r=>r.type===k);if(!rs.length)continue;
    sheet(t.sheet,rs.map(r=>{const o=common(r);t.fields.forEach(f=>{const v=r.fields[f.k]||'';o[f.label]=f.a4?mask4(v):f.type==='date'&&v?fmt(v):v});if(t.members)o['Family Members']=(r.members||[]).map(m=>`${m.name} (${mask4(m.a4)})`).join('; ');return Object.assign(o,tail(r))}))}
  return wb;
}
const stamp=()=>{const d=new Date();return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`};
async function readDistributorFile(file){
  await loadXlsx();
  const wb=XLSX.read(new Uint8Array(await file.arrayBuffer()),{type:'array'});
  const name=wb.SheetNames.find(n=>n.trim().toUpperCase()==='DB')||wb.SheetNames.find(n=>{const r=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''})[0]||[];return String(r[0]).trim().toLowerCase()==='distributor code'});
  if(!name)throw new Error('No DB sheet found. The file needs a sheet named DB with "Distributor Code" in cell A1.');
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:''});
  const h=rows.findIndex(r=>String(r[0]).trim().toLowerCase()==='distributor code');
  if(h<0)throw new Error('"Distributor Code" was not found in column A of the DB sheet.');
  const list=[],seen=new Set();
  for(let i=h+1;i<rows.length;i++){const r=rows[i];const code=String(r[0]).trim().replace(/\.0$/,'');if(!/^\d{6,10}$/.test(code)||seen.has(code))continue;seen.add(code);
    list.push({code,name:String(r[1]).trim(),sa:String(r[2]).trim(),district:String(r[4]).trim(),ro:String(r[5]).trim(),market:String(r[7]).trim()})}
  if(!list.length)throw new Error('No distributor codes were found below the heading row.');
  return list;
}

async function submitNew(form){
  if(ui.busy||!ui.sheet||ui.sheet.kind!=='new')return;
  const type=ui.sheet.type,t=TYPES[type];const d=Object.fromEntries(new FormData(form));
  const missing=t.fields.filter(x=>x.req&&!String(d[x.k]||'').trim()).map(x=>x.label);
  if(missing.length)return showErr('formErr','Fill in: '+missing.join(', ')+'.');
  if(d.reason==='Other'&&!String(d.details||'').trim())return showErr('formErr','Describe the reason in Details when you choose Other.');
  for(const f of t.fields)if(f.a4&&!/^\d{4}$/.test(d[f.k]||''))return showErr('formErr',`${f.label}: enter exactly 4 digits.`);
  let members=[];
  if(t.members){members=ui.members.map(m=>({name:m.name.trim(),a4:m.a4.trim()})).filter(m=>m.name||m.a4);
    if(!members.length)return showErr('formErr','Add the family members on the latest ration card.');
    const bad=members.findIndex(m=>!m.name||!/^\d{4}$/.test(m.a4));if(bad>=0)return showErr('formErr',`Family member ${bad+1}: enter the name and exactly 4 Aadhaar digits.`)}
  const lack=t.uploads.find(u=>u.req&&!(ui.pending[u.k]||[]).length);if(lack)return showErr('formErr',`Attach the ${lack.label.toLowerCase()}.`);
  const files=uploadsPayload(t.uploads.map(u=>u.k));
  if(files.reduce((n,f)=>n+f.data.length*0.75,0)>MAX_TOTAL)return showErr('formErr','Attachments together are over 15 MB. Compress them and try again.');
  showErr('formErr','');ui.busy=true;
  const fields={};t.fields.forEach(x=>{if(d[x.k])fields[x.k]=String(d[x.k]).trim()});
  try{
    const res=await run(t.uploads.some(u=>u.scan)?'Uploading and scanning the document…':'Uploading…',()=>call('submitRequest',token,{type,fields,members,files}));
    ui.busy=false;closeSheet();ui.dFilter='all';await refresh();toast(`Request ${res.id} submitted. Confirmation emailed to ${res.email}.`);
  }catch(e){ui.busy=false;showErr('formErr',e.message)}
}

document.addEventListener('change',async e=>{
  const t=e.target,f=t.dataset.f;
  if(f&&(t.tagName==='SELECT'||t.type==='date')){ui[f]=t.value;render();return}
  try{
  if(t.dataset.tog){const d=dist(t.dataset.code),k=t.dataset.tog,val=t.checked,lab={active:'Active',dct:'DCT',ads:'Aadhaar deseeding'}[k];
    const r=await run('Saving…',()=>call('toggleDist',token,d.code,k,val)).catch(()=>{t.checked=!val;return null});
    if(r){d[k]=val;await refresh();toast(`${lab} ${val?'on':'off'} for ${d.name}${r.pinSent?'. PIN emailed.':''}`)}return}
  if(t.dataset.cc){await run('Saving…',()=>call('setCc',token,t.checked));S.me.cc=t.checked;toast(t.checked?'You will also get copies for other sales areas':'Copies for other sales areas turned off');return}
  if(t.id&&t.id.startsWith('file_')){
    const slot=t.dataset.slot,list=[...t.files];t.value='';ui.pending[slot]=ui.pending[slot]||[];
    let saved=0;
    for(const file of list){
      const isImg=file.type.startsWith('image/')||/\.(heic|heif|jpe?g|png)$/i.test(file.name),isPdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name);
      if(!isImg&&!isPdf){toast(`${file.name}: only PDF or photos are accepted.`);continue}
      if(file.size>(isImg?25:5)*1048576){toast(`${file.name} is too large (${mb(file.size)}). ${isPdf?'Keep PDFs under 5 MB.':'Take the photo again at normal size.'}`,6000);continue}
      let item=null;
      if(isImg){overlay('Optimising photo…');try{item=await shrinkImage(file)}finally{overlay(null)}}
      if(!item){
        if(file.size>MAX_FILE){toast(`${file.name} is over 5 MB and could not be reduced. ${isPdf?'Compress the PDF and try again.':'Take the photo again, or save it as JPG.'}`,6000);continue}
        item={name:file.name,type:file.type||(isPdf?'application/pdf':/\.png$/i.test(file.name)?'image/png':/\.(heic|heif)$/i.test(file.name)?'image/heic':'image/jpeg'),size:file.size,data:await readAsData(file)};
      }else saved+=item.from-item.size;
      ui.pending[slot].push(item)}
    if(saved>200*1024)toast(`Photos reduced by ${mb(saved)} for faster upload and clearer scanning.`);
    const p=$('#pend_'+slot);if(p)p.innerHTML=pendingList(slot);return}
  if(t.id==='upDB'){const file=t.files[0];t.value='';if(!file)return;
    try{overlay('Reading the file…');importSheet(await readDistributorFile(file),file.name)}catch(err){toast(err.message||'The file could not be read.',6000)}finally{overlay(null)}return}
  if(t.id==='restoreIn'){ui.restoreFile=t.files[0]||null;render();return}
  }catch(err){}
});

document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;
  try{
  if(f.id==='loginForm'){
    const d=Object.fromEntries(new FormData(f));
    let res;
    if(ui.loginRole==='dist'){if(!d.code)return showErr('loginErr','Select your SAP code.');ui.lastCode=d.code;
      res=await run('Logging in…',()=>call('loginDist',d.code,d.pin)).catch(err=>{showErr('loginErr',err.message);return null})}
    else{ui.lastEmail=(d.email||'').trim();res=await run('Logging in…',()=>call('loginOfficer',ui.lastEmail,d.pwd)).catch(err=>{showErr('loginErr',err.message);return null})}
    if(!res)return;
    setToken(res.token);await run('Loading…',refresh);window.scrollTo(0,0);if(res.temp)pwdSheet(true);
  }
  else if(f.id==='newForm')submitNew(f);

    const remark=(new FormData(f).get('remark')||'').trim();if(!remark)return showErr('formErr','Write a reply explaining what you corrected.');
    const id=ui.sheet.id;const r=await run('Uploading…',()=>call('resubmit',token,id,remark,uploadsPayload(['resub']))).catch(err=>{showErr('formErr',err.message);return null});
    if(!r)return;await refresh();detail(id);toast(`${id} resubmitted. Confirmation emailed to ${r.email}.`);
  }
  else if(f.id==='adminForm'){

    const r=await run('Adding officer…',()=>call('addOfficer',token,d.name,d.email,d.sa)).catch(err=>{showErr('adminErr',err.message);return null});
    if(!r)return;await refresh();toast(`Officer added. Login details emailed to ${r.email}.`,6000);
  }
  else if(f.id==='pwdForm'){
    const d=Object.fromEntries(new FormData(f));
    if(d.p1!==d.p2)return showErr('formErr','The two new passwords do not match.');
    const ok=await run('Saving…',()=>call('changePassword',token,d.cur||'',d.p1)).catch(err=>{showErr('formErr',err.message);return null});
    if(!ok)return;ui.sheet.forced=false;closeSheet(true);await refresh();toast('Password changed');
  }
  else if(f.id==='transferForm'){
    const d=Object.fromEntries(new FormData(f));if(!d.to)return showErr('transferErr','Select the new super admin.');
    const r=await run('Sending code…',()=>call('startTransfer',token,d.to,d.pwd)).catch(err=>{showErr('transferErr',err.message);return null});
    if(!r)return;await refresh();toast(`One-time code emailed to ${r.email}. It is valid for 15 minutes.`,6000);
  }
  else if(f.id==='acceptForm'){
    const code=(new FormData(f).get('code')||'').trim();
    const ok=await run('Checking…',()=>call('acceptTransfer',token,code)).catch(err=>{showErr('acceptErr',err.message);return null});
    if(!ok)return;await refresh();toast('You are now the super admin. Confirmation emails sent to both of you.',6000);
  }
  else if(f.id==='exportForm'){
    const d=Object.fromEntries(new FormData(f));
    const from=d.from?new Date(d.from+'T00:00:00'):null,to=d.to?new Date(d.to+'T23:59:59'):null;
    const rows=S.requests.filter(r=>{const x=dist(r.code),c=new Date(r.createdAt);
      return (!d.type||r.type===d.type)&&(d.status==='all'||(d.status==='pending'?OPEN.includes(r.status):r.status===d.status))&&(!d.sa||x.sa===d.sa)&&(!d.district||x.district===d.district)&&(!d.code||r.code===d.code)&&(!from||c>=from)&&(!to||c<=to)}).sort((a,b)=>a.createdAt.localeCompare(b.createdAt));
    if(!rows.length)return showErr('formErr','No requests match these choices.');
    await run('Preparing Excel…',loadXlsx);
    const out=XLSX.write(buildWorkbook(rows),{bookType:'xlsx',type:'array'});
    const label=d.status==='pending'?'Pending':d.status==='all'?'All':st(d.status).label.replace(/\W+/g,'');
    download(`Distributor_Requests_${label}${d.type?'_'+d.type:''}_${stamp()}.xlsx`,new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    closeSheet();toast(`${rows.length} requests exported`);
  }
  }catch(err){}
});

let N=null,nLoading=false;

const N_COL={New:'brand',Contacted:'violet',Visited:'teal',Converted:'green',Rejected:'grey'};
const nAge=l=>l.date?(Date.now()-new Date(l.date))/864e5:0;
const nLate=l=>l.status==='New'&&nAge(l)>1;
const nAgeTxt=l=>{const d=nAge(l);if(d<1)return Math.max(1,Math.round(d*24))+' h ago';const n=Math.floor(d);return n+(n===1?' day ago':' days ago')};
async function loadNavya(){if(nLoading)return;nLoading=true;try{N=await call('getNavya',token)}catch(e){toast(e.message,6000)}finally{nLoading=false;render()}}

function distTabs(){

}
function leadRow(l,so){
  const late=nLate(l),rej=l.status==='Rejected';
  const idx=rej?N_STEPS.indexOf(l.visitedAt?'Visited':l.contactedAt?'Contacted':'New'):N_STEPS.indexOf(l.status);

    <div class="row-top"><strong class="lead-name">${esc(l.name||'(no name)')}</strong><span class="chip c-${N_COL[l.status]||'grey'}">${esc(l.status)}</span></div>
    <div class="row-meta">${so?`<span>${l.code?esc(l.distName):'<b class="late">Not assigned</b>'}</span>`:''}<span>${esc([l.pin,l.area].filter(Boolean).join(', '))}</span>${l.hasLpg?`<span>Has LPG: ${esc(l.hasLpg)}</span>`:''}<span class="${late?'late':''}">${nAgeTxt(l)}</span></div>
    ${l.dupOf?'<div class="row-meta"><span class="late">Same mobile number as an earlier lead</span></div>':''}

  </div>`;
}
function nCounts(list){const c={all:list.length,late:0,un:0,as:0};N.statuses.forEach(s=>c[s]=0);list.forEach(l=>{c[l.status]=(c[l.status]||0)+1;if(nLate(l))c.late++;if(!l.code)c.un++;else c.as++});return c}
function nFilter(l,b){return b==='all'||(b==='late'?nLate(l):b==='un'?!l.code:b==='as'?!!l.code:l.status===b)}

function soNavya(){
  if(!N){loadNavya();return '<div class="empty">Loading Navya leads…</div>'}

  const tiles=[['all','All leads',''],['as','Assigned','brand'],['un','Unassigned','amber'],['New','Not contacted','brand'],['late','Over 24 h','red'],['Contacted','Contacted','violet'],['Visited','Visited','teal'],['Converted','Converted','green'],['Rejected','Rejected','grey']];
  const off=(N.navyaDists||[]).filter(d=>!d.active);
  const conv=c.all?Math.round(c.Converted*100/c.all):0;
  let h=`<section class="hello"><div><h1>Navya leads</h1><p class="muted">${c.all} leads, ${c.Converted} converted (${conv}%)</p></div><div class="actions"><button class="btn" data-n="sync">Get new leads now</button><button class="btn" data-n="export">Export to Excel</button></div></section>`;
  if(!N.sourceSet)h+='<div class="note">The Meta leads sheet is not linked yet. Fill NAVYA.SOURCE_ID in Code.gs.</div>';
  if(!N.mailOn)h+='<div class="note">Lead emails to distributors are off. Set NAVYA.MAIL_ON to true in Code.gs after testing.</div>';
  if(off.length)h+=`<div class="note">${off.length} Navya distributor${off.length>1?'s are':' is'} not active and can't log in: ${off.map(d=>esc(d.name)).join(', ')}. Activate them in the Distributors tab.</div>`;
  h+=`<div class="tiles">${tiles.map(([k,l,col])=>`<button class="tile ${col?'c-'+col:''}" data-n="nBucket" data-v="${k}" aria-pressed="${ui.nBucket===k}"><b>${c[k]||0}</b><span>${l}</span></button>`).join('')}</div>
    <div class="filters"><select data-f="nDist" aria-label="Distributor">${opts((N.navyaDists||[]).map(d=>[d.code,d.name]),ui.nDist,'All Navya distributors')}</select>
    <input data-f="nq" type="search" placeholder="Search name, mobile, area, consumer no" value="${esc(ui.nq)}" aria-label="Search leads"></div>`;
  if(ui.nBucket==='all'&&!ui.nDist&&!q){
    const by={};N.leads.forEach(l=>{if(!l.code)return;const b=by[l.code]=by[l.code]||{name:l.distName,t:0,n:0,cv:0,rj:0,late:0};b.t++;if(l.status==='New')b.n++;if(l.status==='Converted')b.cv++;if(l.status==='Rejected')b.rj++;if(nLate(l))b.late++});
    const rows=Object.keys(by).sort((a,b)=>by[b].t-by[a].t);
    if(rows.length)h+=`<div class="card ntable-wrap"><table class="mtable ntable"><thead><tr><th>Distributor</th><th>Leads</th><th>New</th><th>Converted</th><th>Rejected</th><th>Over 24 h</th></tr></thead><tbody>${rows.map(k=>{const b=by[k];return `<tr data-n="pickDist" data-v="${k}"><td>${esc(b.name)}</td><td>${b.t}</td><td>${b.n}</td><td>${b.cv}</td><td>${b.rj}</td><td class="${b.late?'late':''}">${b.late}</td></tr>`}).join('')}</tbody></table></div>`;
    const rs={};N.leads.forEach(l=>{if(l.status==='Rejected')rs[l.reason]=(rs[l.reason]||0)+1});

  case 'sync':{const r=await run('Checking the Meta sheet…',()=>call('syncNavyaNow',token));N=r.data;render();toast(r.added?r.added+' new lead'+(r.added>1?'s':'')+' added':'No new leads');break}
  case 'export':{await run('Preparing Excel…',loadXlsx);
    const rows=N.leads.map(l=>({'Enquiry date':fmtT(l.date),'Name':l.name,'Mobile':l.phone,'Pin code':l.pin,'Area':l.area,'Has LPG':l.hasLpg,'Platform':l.platform,'Distributor':l.distName,'Dist code':l.code,'Status':l.status,'Contacted':fmtT(l.contactedAt),'Visited':fmtT(l.visitedAt),'Closed':fmtT(l.closedAt),'Consumer no':l.consumerNo,'Connection type':l.connType,'Reject reason':l.reason,'Remarks':l.remarks,'Updated by':l.updatedBy}));
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Navya leads');
    download(`Navya_Leads_${stamp()}.xlsx`,new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));toast(rows.length+' leads exported');break}
  }}catch(err){}
});
document.addEventListener('submit',async e=>{
  const f=e.target;if(f.id!=='distForm')return;e.preventDefault();
  const x=Object.fromEntries(new FormData(f));x.isNew=ui.sheet.isNew;if(!x.isNew)x.code=ui.sheet.code;
  if(x.mobile&&!/^[6-9]\d{9}$/.test(x.mobile.replace(/\D/g,'').slice(-10)))return showErr('distErr','Mobile number must be 10 digits starting with 6, 7, 8 or 9.');
  try{const d=await run('Saving…',()=>call('saveDist',token,x));closeSheet();await refresh();toast(x.isNew?d.name+' added. Switch on Active when they should log in.':'Changes saved for '+d.name,6000)}
  catch(err){showErr('distErr',err.message)}
});
document.addEventListener('submit',async e=>{
  const f=e.target;if(f.id!=='pinsForm')return;e.preventDefault();
  const code=ui.sheet.code,val=new FormData(f).get('pins')||'';
  try{const r=await run('Saving…',()=>call('setPins',token,code,val));S.pins=S.pins||{};S.pins[code]=r.pins;N=null;closeSheet();render();
    toast('Pin codes saved'+(r.shared.length?'. Shared with another distributor: '+r.shared.join(', '):''),6000)}
  catch(err){showErr('pinsErr',err.message)}
});
document.addEventListener('submit',async e=>{
  const f=e.target;if(f.id!=='leadForm')return;e.preventDefault();
  if(ui.busy)return;const d=Object.fromEntries(new FormData(f));d.status=ui.nPick;
  if(d.status==='Converted'&&!/^\d{5,15}$/.test((d.consumerNo||'').trim()))return showErr('leadErr','Enter the consumer number (digits only).');
  if(d.status==='Converted'&&!d.connType)return showErr('leadErr','Choose the connection type.');
  if(d.status==='Rejected'&&!d.reason)return showErr('leadErr','Choose the reason for rejection.');
  if(d.status==='Rejected'&&d.reason==='Other'&&!(d.remarks||'').trim())return showErr('leadErr','Write the reason in Remarks when you choose Other.');
  showErr('leadErr','');ui.busy=true;
  try{const l=await run('Saving…',()=>call('updateLead',token,ui.sheet.id,d));ui.busy=false;nReplace(l);closeSheet();
    if(S.role==='dist')S.navya.fresh=N.leads.filter(x=>x.status==='New').length;render();toast('Update saved')}
  catch(err){ui.busy=false;showErr('leadErr',err.message)}
});

(async function init(){
  if(token){try{await refresh();return}catch(e){setToken(null)}}
  try{loginList=await call('getLoginList')}catch(e){loginList=[]}
  render();
})();
})();
</script>

</body>
</html>
